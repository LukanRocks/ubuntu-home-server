# Whisper (faster-whisper) — speech-to-text via Wyoming for Home Assistant

services:
  whisper:
    container_name: whisper
    image: rhasspy/wyoming-whisper
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=$TZ
    volumes:
      - $DOCKER_DATA_DIR/whisper:/data   # downloaded models
    networks:
      traefik-proxy:
        ipv4_address: 172.18.0.103 # fixed ip to be easily targeted | Maybe is unecessary, review later
    # Only HA will directly access
    # ports:
    #   - 10300:10300
    # TODO: verify bash is available in this image, then enable (Wyoming is TCP-only, no HTTP)
    # healthcheck:
    #   test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10300'"]
    #   interval: 30s
    #   timeout: 5s
    #   start_period: 30s
    #   retries: 3
    command:
      - --model
      - small-int8
      - --language
      - en