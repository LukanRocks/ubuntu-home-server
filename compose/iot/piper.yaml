# Piper — neural text-to-speech (Wyoming) for Home Assistant

services:
  piper:
    container_name: piper
    image: rhasspy/wyoming-piper
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=$TZ
    volumes:
      - $DOCKER_DATA_DIR/piper:/data   # downloaded voices
    networks:
      traefik-proxy:
        ipv4_address: 172.18.0.102 # fixed ip to be easily targeted | Maybe is unecessary, review later
    # Only HA will directly access
    # ports:
    #   - 10200:10200
    # TODO: verify bash is available in this image, then enable (Wyoming is TCP-only, no HTTP)
    # healthcheck:
    #   test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10200'"]
    #   interval: 30s
    #   timeout: 5s
    #   start_period: 30s
    #   retries: 3
    command:
      - --voice
      - en_US-lessac-medium