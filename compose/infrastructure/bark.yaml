# iOS notification server

services:
  bark:
    container_name: bark
    image: ghcr.io/finb/bark-server:v2.3.5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKER_DATA_DIR/bark:/data
    networks:
      - traefik-proxy
    # TODO: verify wget is available in this image, then enable
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
    #   interval: 30s
    #   timeout: 5s
    #   start_period: 15s
    #   retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.bark-router.rule=Host(`bark.homeserver.lukan.rocks`)
      - traefik.http.routers.bark-router.entrypoints=web,websecure
      - traefik.http.routers.bark-router.tls=true
      - traefik.http.routers.bark-router.tls.certresolver=letsencrypt
      - traefik.http.routers.bark-router.service=bark-services
      - traefik.http.services.bark-services.loadbalancer.server.port=8080
