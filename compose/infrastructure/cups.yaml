# Printer management

services:
  cups:
    container_name: cups
    image: chuckcharlie/cups-avahi-airprint:latest
    restart: unless-stopped
    network_mode: host # required: AirPrint discovery needs multicast/mDNS on the LAN
    security_opt:
      - no-new-privileges:true
    env_file: # Password and Secrets only file
      - $DOCKER_SECRETS_DIR/cups_secrets
    environment:
      - TZ=$TZ
    volumes:
      - $DOCKER_DATA_DIR/cups:/config
    # TODO: verify curl is available in this image, then enable
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:631/"]
    #   interval: 30s
    #   timeout: 5s
    #   start_period: 15s
