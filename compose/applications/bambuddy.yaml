services:
  bambuddy:
    container_name: bambuddy
    image: ghcr.io/maziggy/bambuddy:1.2.5.3
    restart: unless-stopped
    network_mode: host  # Recommended for automatic printer discovery
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=$TZ
      - BAMBUDDY_EXTERNAL_ROOTS=/external/3d-printing
    volumes:
      - $DOCKER_DATA_DIR/bambuddy:/app/data
      - $DOCKER_LOGS_DIR/bambuddy:/app/logs
      - $DOCKER_MOUNTS_DIR/3d-printing:/external/3d-printing
    # TODO: verify wget is available in this image, then enable
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/"]
    #   interval: 30s
    #   timeout: 5s
    #   start_period: 30s
    #   retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.bambuddy-router.rule=Host(`bambuddy.homeserver.lukan.rocks`)
      - traefik.http.routers.bambuddy-router.entrypoints=web,websecure
      - traefik.http.routers.bambuddy-router.tls=true
      - traefik.http.routers.bambuddy-router.tls.certresolver=letsencrypt
      - traefik.http.routers.bambuddy-router.service=bambuddy-services
      - traefik.http.services.bambuddy-services.loadbalancer.server.port=8000
