# Local manage Excalidraw app - https://github.com/LukanRocks/excalihome

services:
  excalihome:
    container_name: excalihome
    image: ghcr.io/lukanrocks/excalihome:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKER_DATA_DIR/excalihome:/app/data:rw
    networks:
      - traefik-proxy
    # TODO: confirm the internal port/health path this app listens on, then enable
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:<PORT>/"]
    #   interval: 30s
    #   timeout: 5s
    #   start_period: 15s
    #   retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.excalihome-router.rule=Host(`excalihome.homeserver.lukan.rocks`)
      - traefik.http.routers.excalihome-router.entrypoints=web,websecure
      - traefik.http.routers.excalihome-router.tls=true
      - traefik.http.routers.excalihome-router.tls.certresolver=letsencrypt
