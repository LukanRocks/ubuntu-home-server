services:
  nf-price-tracker:
    container_name: nf-price-tracker
    image: ghcr.io/lukanrocks/nf-price-tracker:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKER_DATA_DIR/nf-price-tracker:/app/data:rw
    networks:
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.nf-price-tracker-router.rule=Host(`nf.homeserver.lukan.rocks`)
      - traefik.http.routers.nf-price-tracker-router.entrypoints=web,websecure
      - traefik.http.routers.nf-price-tracker-router.tls=true
      - traefik.http.routers.nf-price-tracker-router.tls.certresolver=letsencrypt
      - traefik.http.routers.nf-price-tracker-router.service=nf-price-tracker-services
      - traefik.http.services.nf-price-tracker-services.loadbalancer.server.port=3000
    # environment:
      # Optional: shows the "Exemplo" button with this QR URL prefilled.
      # A real note identifies a real person, so keep it in .env, not here.
      # NFCE_SAMPLE_URL: ${NFCE_SAMPLE_URL:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
